name: CI

on:
  # Every PR is gated, including stacked PRs whose base is another feature
  # branch — narrowing this to main silently left stacked work unbuilt.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: a cancelled required check blocks the branch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Required status check on main. The job always runs so the check always
  # reports; only the app steps are conditional, so a docs-only PR is green
  # without skipping the workflow itself.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fail closed: app steps are skipped ONLY when package.json is absent on
      # both the head and the base ref. A PR that deletes package.json from an
      # app-having base still gets installed/typechecked/built (and therefore
      # fails), so the skip cannot be used to buy a green required check.
      - name: Detect application
        id: app
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          head_has=no
          [ -f package.json ] && head_has=yes

          base_has=yes   # fail closed: unknown base counts as "has app"
          if [ -z "${BASE_REF}" ]; then
            base_has="$head_has"
          elif git fetch --no-tags --depth=1 origin "${BASE_REF}" 2>/dev/null; then
            # Fetch succeeded, so an unreadable package.json means it is really
            # absent on the base ref (docs-only base), not that we lost the ref.
            if git show FETCH_HEAD:package.json >/dev/null 2>&1; then
              base_has=yes
            else
              base_has=no
            fi
          else
            echo "::warning::could not fetch base '${BASE_REF}' - treating as app present (fail closed)"
            base_has=yes
          fi

          if [ "$head_has" = "no" ] && [ "$base_has" = "no" ]; then
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "docs-only ref: no package.json on head or base - app steps skipped, required check still reports" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=yes" >> "$GITHUB_OUTPUT"
            echo "app present (head=${head_has} base=${base_has}) - full gate runs" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.app.outputs.present == 'yes'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.app.outputs.present == 'yes'
        run: npm ci

      - name: Lint
        if: steps.app.outputs.present == 'yes'
        run: npm run lint

      - name: Typecheck
        if: steps.app.outputs.present == 'yes'
        run: npm run typecheck

      - name: Build
        if: steps.app.outputs.present == 'yes'
        run: npm run build

      - name: Docs-only (app build not required)
        if: steps.app.outputs.present == 'no'
        run: echo "docs-only ref - app steps skipped, required check satisfied"
