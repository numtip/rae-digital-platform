# REFERENCE ONLY — do not install from git without owner approval.
# Apply on the VPS host under /etc/nginx/ after P1 sign-off (MJU IT).
# Basic Auth credentials live outside git: /etc/nginx/secrets/rae-digital-staging.htpasswd

# STAGING ONLY — owner approval required
location ^~ /rae-digital-staging/ {
    auth_basic           "RAE Digital Staging";
    auth_basic_user_file /etc/nginx/secrets/rae-digital-staging.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_pass         http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Prefix /rae-digital-staging;

    # Do not cache authenticated staging HTML at shared caches.
    add_header Cache-Control "private, no-store" always;
}
