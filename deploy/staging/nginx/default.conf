# Static export for VPS staging (loopback upstream only).
# Host nginx strips /rae-digital-staging/ before proxy_pass to this container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;
    autoindex off;

    # Container health (host may expose via proxy as /rae-digital-staging/healthz).
    location = /healthz {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","env":"staging-static"}';
    }

    location / {
        # Block path traversal attempts (defence in depth; root is read-only).
        if ($request_uri ~* "\.\.") {
            return 403;
        }
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|txt|xml)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
