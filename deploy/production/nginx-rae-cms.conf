# OPTIONAL — only if the owner chooses an mju.ac.th hostname instead of the Cloudflare Tunnel.
# Install as /etc/nginx/sites-available/rae-cms.conf (new file; raeservice.mju.ac.th is NOT edited),
# enable with a symlink, `sudo nginx -t && sudo systemctl reload nginx`. Needs DNS for the hostname.
# Rollback: remove the symlink, nginx -t, reload.
server {
    listen 80;
    server_name rae-cms.mju.ac.th;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name rae-cms.mju.ac.th;
    ssl_certificate     /etc/ssl/mju/mju_ac_th.fullchain.crt;
    ssl_certificate_key /etc/ssl/mju/mju_ac_th.key;   # confirm the key file name beside the cert

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Only the Next container; the CMS API on 3317 is reached through Next's /cms-api rewrite.
    location / {
        proxy_pass http://127.0.0.1:3417;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 12m;
    }
}
