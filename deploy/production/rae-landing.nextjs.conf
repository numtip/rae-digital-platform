# RAE canonical public site: https://raeservice.mju.ac.th/rae-landing/  ->  Next.js (CMS-backed), loopback :3418.
# Replaces the static-alias block of /home/rae_admin/rae-landing/nginx/rae-landing.conf. Everything else in that
# file (redirects, /th/ /en/ legacy redirects, the /_next/ alias for old static pages) is kept byte-for-byte.
# The admin desk and the CMS API stay on https://rae-cms.raemanagemju.net (MJU SSO callback registered there).

location = /rae-landing {
	return 301 /rae-landing/th/;
}

location = /rae-landing/ {
	return 301 /rae-landing/th/;
}

location = /rae-landing/th {
	return 301 /rae-landing/th/;
}

location = /rae-landing/en {
	return 301 /rae-landing/en/;
}

location ~ ^(/rae-landing/(?:th|en)/)(?:rae-landing/(?:th|en)/)+(.*)$ {
	return 301 $1$2;
}

# One admin domain: the desk and the CMS API are not offered on the public host.
location ~ ^/rae-landing/(th|en)/cms-admin {
	return 301 https://rae-cms.raemanagemju.net/$1/cms-admin/;
}

location ^~ /rae-landing/cms-api/ {
	return 404;
}

# The revalidate hook is for the CMS container only (docker network); the public host serves media only.
location ^~ /rae-landing/api/news-live/media/ {
	proxy_pass http://127.0.0.1:3418;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header X-Forwarded-For $remote_addr;
}

# Counted, redirecting open link of the Document Center (the target comes from the CMS record, never the request).
location ^~ /rae-landing/api/documents/ {
	proxy_pass http://127.0.0.1:3418;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header X-Forwarded-For $remote_addr;
}

location ^~ /rae-landing/api/ {
	return 404;
}

location /rae-landing/ {
	proxy_pass http://127.0.0.1:3418;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_read_timeout 60s;
}

location ^~ /th/ {
	return 301 /rae-landing$uri;
}

location ^~ /en/ {
	return 301 /rae-landing$uri;
}

location ^~ /_next/ {
	alias /var/www/raeservice/landing/_next/;
	try_files $uri =404;
	expires 365d;
	access_log off;
	add_header Cache-Control "public, max-age=31536000, immutable" always;
}
