# Isolated static staging — project name rae-digital-staging
# Loopback only. Do not deploy without owner approval (see docs/ops/vps-staging/).

name: rae-digital-staging

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.staging
    image: rae-digital-staging-static:${RAE_STAGING_RELEASE:-local}
    container_name: rae-digital-staging-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    networks:
      - rae-digital-staging-net
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777,size=16M
      - /var/run:mode=1777,size=1M
      - /tmp:mode=1777,size=1M
    mem_limit: 256m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "rae-digital-staging/{{.Name}}"

networks:
  rae-digital-staging-net:
    name: rae-digital-staging-net
    driver: bridge
